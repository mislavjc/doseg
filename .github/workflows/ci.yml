name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('bun.lock', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-${{ hashFiles('bun.lock', 'tsconfig.json') }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run format:check
      - run: bun run dup

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run knip

  # Playwright smoke, behaviour and visual tests against a production build
  # (next build && next start) with every upstream replayed from
  # e2e/fixtures/. Runs in the Playwright image, which carries the browsers and
  # the fonts the screenshot baselines were rendered with (scripts/e2e.sh uses
  # the same image locally). Keep the image tag on the @playwright/test version.
  # Job id and name are stable: required-check material.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-e2e-${{ hashFiles('bun.lock') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'hooks/**', 'next.config.mjs') }}
          restore-keys: next-e2e-${{ hashFiles('bun.lock') }}-
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: transit
      - run: cargo fmt --manifest-path transit/Cargo.toml -- --check
      - run: cargo clippy --manifest-path transit/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path transit/Cargo.toml
      - name: lib/generated matches ts-rs output
        run: |
          if [ -n "$(git status --porcelain -- lib/generated)" ]; then
            git status --short -- lib/generated
            git diff -- lib/generated
            echo "::error::lib/generated is out of date with the Rust types. Run cargo test --manifest-path transit/Cargo.toml and commit lib/generated."
            exit 1
          fi

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file transit/Cargo.lock
