[package]
name = "scoring"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
memmap2 = "0.9"
osmpbf = "0.3"
rustc-hash = "2"
graphql_client = { version = "0.14", features = ["reqwest-blocking"] }
ureq = { version = "2", features = ["json"] }
indexmap = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
