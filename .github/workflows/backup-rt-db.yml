name: Backup RT DB

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Create backup on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: bash /opt/doseg/scripts/backup-rt-db-local.sh

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Download backup and dev data from server
        run: |
          DATE=$(date -u +%Y-%m-%d)
          SERVER="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          scp -o StrictHostKeyChecking=no \
            "$SERVER:/opt/doseg-backups/gtfs-rt-${DATE}.db.zst" \
            "$SERVER:/opt/doseg/data/gtfs/zet.zip" \
            "$SERVER:/opt/doseg/data/walk-graph.bin" \
            /tmp/
          ls -lh /tmp/gtfs-rt-${DATE}.db.zst /tmp/zet.zip /tmp/walk-graph.bin

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          npm install -g wrangler@latest
          DATE=$(date -u +%Y-%m-%d)
          fail=0

          # Dev-data clone FIRST and each upload independent. These are small and
          # the most important to keep fresh — data.doseg.hr / setup-dev.sh pull
          # the GTFS feed from here. Previously the oversized rt-db upload ran
          # first under `set -e` and aborted the job, silently freezing the R2
          # GTFS clone. Never let one upload block the others again.
          echo "::group::zet.zip -> doseg-data-eu/gtfs/zet.zip"
          wrangler r2 object put "doseg-data-eu/gtfs/zet.zip" --file "/tmp/zet.zip" --remote \
            || { echo "::error::zet.zip upload failed"; fail=1; }
          echo "::endgroup::"

          echo "::group::walk-graph.bin -> doseg-data-eu/walk-graph.bin"
          wrangler r2 object put "doseg-data-eu/walk-graph.bin" --file "/tmp/walk-graph.bin" --remote \
            || { echo "::error::walk-graph.bin upload failed"; fail=1; }
          echo "::endgroup::"

          # rt-db backup LAST: it outgrew wrangler's 300 MiB single-PUT cap
          # (~366 MiB compressed) and the CLI has no multipart. Rather than add
          # S3 credentials, split into <300 MiB chunks and put each with the same
          # token. Restore = get every gtfs-rt-DATE.db.zst.part-* and `cat` them
          # back in order, then `zstd -d`.
          BK="/tmp/gtfs-rt-${DATE}.db.zst"
          echo "::group::${BK} -> doseg-backups (split, 250 MiB chunks)"
          # Remove any stale chunks from earlier runs in this job, then split.
          rm -f "${BK}.part-"*
          split -b 250m -d -a 2 "$BK" "${BK}.part-"
          for part in "${BK}.part-"*; do
            key="doseg-backups/$(basename "$part")"
            echo "putting $key ($(du -h "$part" | cut -f1))"
            wrangler r2 object put "$key" --file "$part" --remote \
              || { echo "::error::rt-db chunk $key upload failed"; fail=1; }
          done
          echo "::endgroup::"

          exit $fail
