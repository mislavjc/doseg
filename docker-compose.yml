services:
  otp:
    image: opentripplanner/opentripplanner:2.9.0_2025-12-15T13-18
    volumes:
      - ./data:/var/opentripplanner
    command: --build --serve
    environment:
      # 1024m OOMed at 34% of trip-pattern generation on ZET's 2026-07 feed
      # (143k trips, service through Dec) - two Monday rolls failed silently.
      # 2048m builds it in ~60s; keep ~1GB headroom over the observed need.
      - JAVA_TOOL_OPTIONS=-Xmx2048m
    healthcheck:
      test: ["CMD-SHELL", "exec wget -qO- http://localhost:8080/otp/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
    restart: unless-stopped

  isochrone:
    build: ./transit
    environment:
      - OTP_URL=http://otp:8080
      - DATA_DIR=/app/data
      - RT_DB_DIR=/app/rt-db
      - PORT=3001
    volumes:
      - ./data:/app/data
      - rt_db:/app/rt-db
    depends_on:
      otp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
    restart: unless-stopped

  # One-shot page-data generator (tools profile → never starts with `up`).
  # Shares the otp/isochrone network and writes regenerated JSON into the ./data
  # mount. Driven by scripts/regen-data.sh, e.g.:
  #   docker compose --profile tools run --rm scorer --line-pages
  # working_dir is one level under the data mount so the binary's hardcoded
  # `../data` resolves to /app/data; user root so it can write the mount.
  scorer:
    build: ./transit
    profiles: ["tools"]
    user: root
    working_dir: /app/transit
    entrypoint: ["transit-scorer"]
    environment:
      - OTP_URL=http://otp:8080
      - ISOCHRONE_URL=http://isochrone:3001
    volumes:
      - ./data:/app/data
    restart: "no"

  app:
    build: .
    environment:
      - OTP_URL=http://otp:8080
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    depends_on:
      otp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)throw r;process.exit(0)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1.5G
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /opt/doseg-certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec curl -sf http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  rt_db:
