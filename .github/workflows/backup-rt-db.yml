name: Backup RT DB

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create backup on server
        uses: appleboy/ssh-action@v1
        with:
          host: 152.53.46.164
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: bash /opt/doseg/scripts/backup-rt-db-local.sh

      - name: Download backup from server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 152.53.46.164 >> ~/.ssh/known_hosts 2>/dev/null

          DATE=$(date -u +%Y-%m-%d)
          scp root@152.53.46.164:/opt/doseg-backups/gtfs-rt-${DATE}.db.zst /tmp/gtfs-rt-${DATE}.db.zst
          ls -lh /tmp/gtfs-rt-${DATE}.db.zst

      - name: Upload to R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: npm
          command: r2 object put doseg-backups/gtfs-rt-$(date -u +%Y-%m-%d).db.zst --file /tmp/gtfs-rt-$(date -u +%Y-%m-%d).db.zst --remote
