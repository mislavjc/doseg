name: Backup RT DB

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Create backup on server
        uses: appleboy/ssh-action@v1
        with:
          host: 152.53.46.164
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: bash /opt/doseg/scripts/backup-rt-db-local.sh

      - name: Download backup from server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 152.53.46.164 >> ~/.ssh/known_hosts 2>/dev/null

          DATE=$(date -u +%Y-%m-%d)
          scp root@152.53.46.164:/opt/doseg-backups/gtfs-rt-${DATE}.db.zst /tmp/gtfs-rt-${DATE}.db.zst
          ls -lh /tmp/gtfs-rt-${DATE}.db.zst

      - name: Refresh dev data (GTFS + walk graph)
        run: |
          scp root@152.53.46.164:/opt/doseg/data/gtfs/zet.zip /tmp/zet.zip
          scp root@152.53.46.164:/opt/doseg/data/walk-graph.bin /tmp/walk-graph.bin

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4b193c5e8516cbd44815cc1b7ce108c6
        run: |
          npm install -g wrangler
          DATE=$(date -u +%Y-%m-%d)
          wrangler r2 object put "doseg-backups/gtfs-rt-${DATE}.db.zst" \
            --file "/tmp/gtfs-rt-${DATE}.db.zst" --remote
          wrangler r2 object put "doseg-data-eu/gtfs/zet.zip" \
            --file "/tmp/zet.zip" --remote
          wrangler r2 object put "doseg-data-eu/walk-graph.bin" \
            --file "/tmp/walk-graph.bin" --remote
