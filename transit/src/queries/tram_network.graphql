query GetTramNetwork($serviceDate: String!) {
  patterns {
    directionId
    headsign
    route {
      mode
      shortName
    }
    stops {
      name
      lat
      lon
      parentStation {
        gtfsId
        name
        lat
        lon
      }
    }
    tripsForDate(serviceDate: $serviceDate) {
      gtfsId
    }
  }
}
