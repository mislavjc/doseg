name: Update GTFS data

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-gtfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save old checksums
        run: |
          if [ -f data/gtfs/checksums.sha256 ]; then
            cp data/gtfs/checksums.sha256 /tmp/old-checksums.txt
          else
            touch /tmp/old-checksums.txt
          fi

      - name: Download ZET GTFS
        run: |
          mkdir -p data/gtfs
          curl -fSL --retry 3 --retry-delay 5 \
            -o data/gtfs/zet.zip \
            "https://zet.hr/gtfs-scheduled/latest"
          echo "ZET: $(du -h data/gtfs/zet.zip | cut -f1)"

      # Gate the update on the feed actually being usable. ZET publishes a
      # rolling window; refuse to ship one that's already expired or empty, and
      # warn when runway is short. This is what would have flagged the 06-15
      # feed running dry instead of it silently turning every isochrone
      # walk-only.
      - name: Validate ZET feed
        id: validate
        run: |
          python3 - <<'PY'
          import zipfile, csv, io, datetime, os, sys
          z = zipfile.ZipFile("data/gtfs/zet.zip")
          def rows(name):
              with z.open(name) as f:
                  yield from csv.DictReader(io.TextIOWrapper(f, "utf-8-sig"))
          DAYS = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"]
          last = 0
          try:
              for r in rows("calendar_dates.txt"):
                  if (r.get("exception_type") or "").strip() == "1":
                      last = max(last, int(r["date"]))
          except KeyError:
              pass
          try:
              for r in rows("calendar.txt"):
                  if any((r.get(d) or "0").strip() == "1" for d in DAYS):
                      last = max(last, int(r["end_date"]))
          except KeyError:
              pass
          trips = sum(1 for _ in rows("trips.txt"))
          today = datetime.date.today()
          ok = "true"
          if last == 0:
              print("::error::could not determine feed service window")
              ok = "false"; runway = -999; ld = "unknown"
          else:
              ld = datetime.datetime.strptime(str(last), "%Y%m%d").date()
              runway = (ld - today).days
              print(f"last service date: {ld}  runway: {runway} days  trips: {trips}")
              if trips == 0:
                  print("::error::feed has zero trips"); ok = "false"
              if runway < 0:
                  print(f"::error::feed already expired ({runway}d) — refusing to ship"); ok = "false"
              elif runway < 14:
                  print(f"::warning::feed has only {runway} days of runway")
          with open(os.environ["GITHUB_OUTPUT"], "a") as g:
              g.write(f"ok={ok}\nrunway={runway}\nlast_date={ld}\ntrips={trips}\n")
          sys.exit(0 if ok == "true" else 1)
          PY

      - name: Download HZPP GTFS
        run: |
          curl -fSL --retry 3 --retry-delay 5 \
            -o data/gtfs/hzpp.zip \
            "https://www.hzpp.hr/GTFS_files.zip"
          echo "HZPP: $(du -h data/gtfs/hzpp.zip | cut -f1)"

      - name: Filter HZPP to Zagreb area
        run: python3 scripts/filter-hzpp-gtfs.py data/gtfs/hzpp.zip data/gtfs/hzpp-zagreb.zip

      - name: Check for changes
        id: diff
        run: |
          cd data/gtfs
          sha256sum zet.zip hzpp.zip hzpp-zagreb.zip > checksums.sha256
          cat checksums.sha256

          if diff -q /tmp/old-checksums.txt checksums.sha256 >/dev/null 2>&1; then
            echo "No changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "GTFS feeds have changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

          # Forward the new checksum content to the server regen so it can record
          # the audit trail (data/gtfs/checksums.sha256) in the same commit as the
          # regenerated page data.
          {
            echo "CHECKSUMS<<__CHK__"
            cat checksums.sha256
            echo "__CHK__"
          } >> "$GITHUB_ENV"

      # 1. Live graph. The zips are gitignored, so merging a PR can't ship them —
      # the server must re-download and rebuild OTP. refresh-gtfs.sh validates,
      # rebuilds, health-checks, and rolls back on failure. Fixes the live
      # map/isochrone immediately. This is the step whose absence let the feed rot.
      - name: Refresh feed on server
        if: steps.diff.outputs.changed == 'true' && steps.validate.outputs.ok == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: bash /opt/doseg/scripts/refresh-gtfs.sh --download

      # 2. Committed page data. The SSG line/stop pages are baked from committed
      # JSON, so refreshing the graph alone leaves them stale. regen-data.sh
      # regenerates data/linije + data/stanice from the freshly-rebuilt graph
      # (schedule-only reach for determinism), runs a fail-closed validation gate,
      # and — only on a material change — commits + pushes the update-gtfs-data
      # branch (carrying the checksum audit trail too). GH_TOKEN is the run-scoped
      # GITHUB_TOKEN, used purely to push the branch.
      - name: Regenerate page data on server
        if: steps.diff.outputs.changed == 'true' && steps.validate.outputs.ok == 'true'
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 45m
          envs: GH_TOKEN,CHECKSUMS,GITHUB_REPOSITORY
          script: bash /opt/doseg/scripts/regen-data.sh

      # 3. Open the data PR for review. Merging it triggers deploy.yml, which
      # rebuilds the SSG app with the fresh data. Left for a human click for now;
      # flip to auto-merge once the gate thresholds are proven against a couple of
      # real feed rolls. No-op (skips) when the server pushed nothing.
      - name: Open page-data PR
        if: steps.diff.outputs.changed == 'true' && steps.validate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base main --head update-gtfs-data \
            --title "Refresh transit data (${{ steps.diff.outputs.date }})" \
            --body "Regenerated pSEO page data from the refreshed GTFS feed (last service ${{ steps.validate.outputs.last_date }}, ${{ steps.validate.outputs.trips }} trips). Validated by \`scripts/regen-data-gate.py\` (count floors + reach coverage). Review the diff, then merge to deploy." \
            || echo "No new commits to PR (schedule unchanged), or a PR is already open — skipping."
