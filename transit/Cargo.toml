[package]
name = "transit"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "transit-scorer"
path = "src/main.rs"

[[bin]]
name = "isochrone-server"
path = "src/isochrone_server.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
memmap2 = "0.9"
osmpbf = "0.3"
rustc-hash = "2"
graphql_client = { version = "0.14", features = ["reqwest-blocking"] }
ureq = { version = "2", features = ["json"] }
indexmap = "2"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["compression-full", "cors"] }
ts-rs = { version = "10", features = ["serde-compat"] }
prost = "0.13"
zip = "2"
csv = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
