name: Backup RT DB

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Create backup on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: bash /opt/doseg/scripts/backup-rt-db-local.sh

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Download backup and dev data from server
        run: |
          DATE=$(date -u +%Y-%m-%d)
          SERVER="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          scp -o StrictHostKeyChecking=no \
            "$SERVER:/opt/doseg-backups/gtfs-rt-${DATE}.db.zst" \
            "$SERVER:/opt/doseg/data/gtfs/zet.zip" \
            "$SERVER:/opt/doseg/data/walk-graph.bin" \
            /tmp/
          ls -lh /tmp/gtfs-rt-${DATE}.db.zst /tmp/zet.zip /tmp/walk-graph.bin

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@latest
          DATE=$(date -u +%Y-%m-%d)
          wrangler r2 object put "doseg-backups/gtfs-rt-${DATE}.db.zst" \
            --file "/tmp/gtfs-rt-${DATE}.db.zst" --remote
          wrangler r2 object put "doseg-data-eu/gtfs/zet.zip" \
            --file "/tmp/zet.zip" --remote
          wrangler r2 object put "doseg-data-eu/walk-graph.bin" \
            --file "/tmp/walk-graph.bin" --remote
