procs:
  next:
    shell: "exec bun dev"
    stop:
      send-keys: ["<C-c>"]
    env:
      ISOCHRONE_URL: "http://localhost:3002"

  isochrone:
    shell: "cd transit && exec cargo watch -x 'run --bin isochrone-server'"
    stop:
      send-keys: ["<C-c>"]
    env:
      OTP_URL: "http://localhost:8080"
      DATA_DIR: "../data"
      RT_DB_DIR: "../data"
      PORT: "3002"

  # OTP on :8080 — auto-selects source (see scripts/otp.sh):
  #   reuse running OTP -> SSH tunnel to netcup if reachable -> local Docker.
  otp:
    shell: "exec ./scripts/otp.sh"
    stop:
      send-keys: ["<C-c>"]
