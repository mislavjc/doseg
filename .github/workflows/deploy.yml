name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/doseg

            # Save rollback point
            PREV_SHA=$(git rev-parse HEAD)

            git fetch origin main
            git reset --hard origin/main

            DOCKER_BUILDKIT=1 docker compose up -d --build --remove-orphans
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f

            # Poll health checks (up to 2 minutes)
            for i in $(seq 1 24); do
              if curl -sf http://localhost/api/health > /dev/null 2>&1; then
                echo "Health check passed after ${i}x5s"
                exit 0
              fi
              echo "Waiting for health... ($i/24)"
              sleep 5
            done

            # Rollback on failure
            echo "Health check failed — rolling back to $PREV_SHA"
            git reset --hard "$PREV_SHA"
            docker compose up -d --build --remove-orphans
            exit 1
