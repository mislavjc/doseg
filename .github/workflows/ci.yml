name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: transit
      - run: cargo clippy --manifest-path transit/Cargo.toml -- -D warnings
      - run: cargo fmt --manifest-path transit/Cargo.toml -- --check
      - run: cargo test --manifest-path transit/Cargo.toml
      - run: cargo install cargo-audit --quiet
      - run: cargo audit --file transit/Cargo.lock
