[package]
name = "transit"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "transit-scorer"
path = "src/main.rs"

[[bin]]
name = "isochrone-server"
path = "src/isochrone_server.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
memmap2 = "0.9"
osmpbf = "0.3"
rustc-hash = "2"
graphql_client = { version = "0.16", features = ["reqwest-blocking"] }
ureq = { version = "3", features = ["json"] }
indexmap = "2"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["compression-full", "cors"] }
ts-rs = { version = "12", features = ["serde-compat"] }
prost = "0.14"
zip = "9"
csv = "1"
rusqlite = { version = "0.43", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Restriction lints for leftovers that must never ship; CI promotes every warning to an error with -D warnings.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Grid, routing and stats code converts between f64 coordinates/seconds and integer indices/counts whose ranges are bounded by the Zagreb bbox and feed size.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Long linear pipelines (data generation, request handlers); splitting them would add indirection without making them clearer.
too_many_lines = "allow"
# Hot-path heap and distance helpers are force-inlined on purpose for the Dijkstra inner loops.
inline_always = "allow"
# Paired geo names (cx/cy, nx/ny, tid/rid) are the clearest names in this code.
similar_names = "allow"
# CLI flag structs and GTFS calendar weekday columns are naturally sets of bools.
struct_excessive_bools = "allow"
# One explicit arm per mode/month keeps lookup tables readable even when values repeat the fallback.
match_same_arms = "allow"
